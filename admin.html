<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Admin</title>
    <link rel="stylesheet" href="/css/style-admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Config Admin</h1>
        <div class="muted">Copy Right © D16 IT Team</div>
      </div>
      <div class="topbar-actions">
        <div class="topbar-main-actions">
          <span id="meBox" class="chip"></span>
          <button id="reloadBtn" type="button" class="secondary">Reload</button>
          <button id="logoutBtn" type="button" class="danger">Logout</button>
        </div>

        <div class="topbar-config-actions">
          <button id="resetBtn" type="button" class="secondary">Return</button>
          <button id="saveBtn" type="button">Save</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="card">
        <div class="section-head">
          <h2>Config</h2>
        </div>

        <div class="stack">
          <label class="toggle">
            <input id="enableFirework" type="checkbox" />
            <span>Enable Firework</span>
          </label>

          <div id="contentidolSection" class="group-box">
            <div class="group-head">
              <h3>Content Idol</h3>
              <button
                type="button"
                data-add="contentidol"
                class="secondary small"
              >
                + Add
              </button>
            </div>
            <div id="contentidolList" class="contentidol-list"></div>
          </div>

          <div id="contentidolSettingsSection" class="group-box">
            <div class="group-head">
              <h3>Content Idol Settings</h3>
            </div>

            <label class="toggle compact-toggle">
              <input id="contentidolEnabled" type="checkbox" />
              <span>Enable Content Idol</span>
            </label>

            <div class="settings-grid">
              <label class="compact-field">
                <span>Show Minutes</span>
                <input id="contentidolShowMinutes" type="text" />
              </label>

              <label class="compact-field">
                <span>Hide Minutes</span>
                <input id="contentidolHideMinutes" type="text" />
              </label>

              <label class="compact-field">
                <span>Interval Minutes</span>
                <input id="contentidolIntervalMinutes" type="text" />
              </label>

              <label class="compact-field">
                <span>Repeat Count</span>
                <input id="contentidolRepeatCount" type="text" />
              </label>

              <label class="compact-field">
                <span>Speed Px Per Second</span>
                <input id="contentidolSpeedPxPerSecond" type="text" />
              </label>

              <label class="compact-field">
                <span>Font Size</span>
                <input id="contentidolFontSize" type="text" />
              </label>

              <label class="compact-field">
                <span>Copies Per Run</span>
                <input id="contentidolCopiesPerRun" type="text" />
              </label>

              <label class="compact-field">
                <span>Copy Gap Size</span>
                <input id="contentidolCopyGapSize" type="text" />
              </label>

              <label class="compact-field">
                <span>Lane Gap Px</span>
                <input id="contentidolLaneGapPx" type="text" />
              </label>

              <label class="compact-field color-field">
                <span>Text Color</span>
                <div class="color-input-row">
                  <input id="contentidolTextColor" type="color" />
                  <input
                    id="contentidolTextColorCode"
                    type="text"
                    placeholder="#ffffff"
                  />
                </div>
              </label>
            </div>
          </div>

          <div id="domains1bSection" class="group-box">
            <div class="group-head">
              <h3>Domains 1B</h3>
              <button
                type="button"
                data-add="domains1b"
                class="secondary small"
              >
                + Add
              </button>
            </div>
            <div id="domains1bList" class="domain-list"></div>
          </div>

          <div id="domains789Section" class="group-box">
            <div class="group-head">
              <h3>Domains 789</h3>
              <button
                type="button"
                data-add="domains789"
                class="secondary small"
              >
                + Add
              </button>
            </div>
            <div id="domains789List" class="domain-list"></div>
          </div>

          <div id="domains0bSection" class="group-box">
            <div class="group-head">
              <h3>Domains 0B</h3>
              <button
                type="button"
                data-add="domains0b"
                class="secondary small"
              >
                + Add
              </button>
            </div>
            <div id="domains0bList" class="domain-list"></div>
          </div>

          <div id="saveMessage" class="ok"></div>
          <div id="saveError" class="error"></div>
        </div>
      </section>

      <section id="changeLogsCard" class="card">
        <div class="section-head">
          <h2>Change Logs</h2>
          <button id="reloadLogsBtn" type="button" class="secondary">
            Reload Logs
          </button>
        </div>
        <div id="logsBox" class="logs-box"></div>
      </section>

      <section id="userCard" class="card admin-only" style="display: none">
        <div class="section-head">
          <h2>User Management</h2>
          <div class="row-actions">
            <button id="addUserBtn" type="button" class="secondary">
              Add User
            </button>
            <button id="reloadUsersBtn" type="button" class="secondary">
              Reload Users
            </button>
          </div>
        </div>
        <div id="usersBox" class="users-box"></div>
      </section>
    </main>

    <div id="passwordModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h2>Change Password</h2>
        <p class="muted" id="passwordModalText">
          Bạn cần đổi password trước khi tiếp tục sử dụng.
        </p>

        <form id="passwordForm" class="stack">
          <label id="currentPasswordWrap">
            <span>Current password</span>
            <input
              id="currentPassword"
              type="password"
              autocomplete="current-password"
            />
          </label>

          <label>
            <span>New password</span>
            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              required
            />
          </label>

          <label>
            <span>Confirm new password</span>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
            />
          </label>

          <div class="row-actions">
            <span></span>
            <button id="changePasswordBtn" type="submit">
              Update Password
            </button>
          </div>

          <div id="passwordError" class="error"></div>
          <div id="passwordOk" class="ok"></div>
        </form>
      </div>
    </div>

    <div id="addUserModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h2>Add User</h2>
        <p class="muted">Nhập username, password sẽ được sinh ngẫu nhiên.</p>

        <form id="addUserForm" class="stack">
          <label>
            <span>Username</span>
            <input id="addUsername" type="text" autocomplete="off" required />
          </label>

          <div class="row-actions">
            <button id="cancelAddUserBtn" type="button" class="secondary">
              Cancel
            </button>
            <button id="confirmAddUserBtn" type="submit">Add User</button>
          </div>

          <div id="addUserError" class="error"></div>
          <div id="addUserOk" class="ok"></div>
        </form>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
