<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated X</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #120000;
      }

      .x-wrap {
        width: 420px;
        height: 420px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .warning-x {
        width: 100%;
        height: 100%;
        transform-origin: center;
        animation:
          xScale 0.9s ease-in-out infinite,
          xFlicker 0.9s ease-in-out infinite,
          xDrift 0.18s linear infinite;
        filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.55))
          drop-shadow(0 0 18px rgba(255, 40, 40, 0.45));
      }

      @keyframes xScale {
        0%,
        100% {
          transform: scale(0.92);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes xFlicker {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes xDrift {
        0% {
          translate: 0 0;
        }
        25% {
          translate: 1px -1px;
        }
        50% {
          translate: -1px 1px;
        }
        75% {
          translate: 1px 1px;
        }
        100% {
          translate: 0 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="x-wrap">
      <svg class="warning-x" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="xStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7a0000" />
            <stop offset="25%" stop-color="#ff2020" />
            <stop offset="50%" stop-color="#ff6a6a" />
            <stop offset="75%" stop-color="#ff2020" />
            <stop offset="100%" stop-color="#7a0000" />
          </linearGradient>
        </defs>

        <line
          x1="15"
          y1="15"
          x2="85"
          y2="85"
          stroke="url(#xStroke)"
          stroke-width="14"
          stroke-linecap="round"
        />
        <line
          x1="85"
          y1="15"
          x2="15"
          y2="85"
          stroke="url(#xStroke)"
          stroke-width="14"
          stroke-linecap="round"
        />

        <!-- highlight bên trong -->
        <line
          x1="20"
          y1="20"
          x2="80"
          y2="80"
          stroke="rgba(255,255,255,0.18)"
          stroke-width="4"
          stroke-linecap="round"
        />
        <line
          x1="80"
          y1="20"
          x2="20"
          y2="80"
          stroke="rgba(255,255,255,0.18)"
          stroke-width="4"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </body>
</html>
