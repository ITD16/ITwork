<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X warning reset</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1b0000;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 780px;
        max-width: 100%;
        padding: 22px;
        border-radius: 30px;
        background: linear-gradient(180deg, #5b0000 0%, #340000 100%);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      .content-shell {
        position: relative;
      }

      .content-box {
        --frame-bright: 0.1;
        position: relative;
        min-height: 540px;
        border-radius: 34px;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 40%,
            rgba(120, 0, 0, 0.08),
            transparent 56%
          ),
          linear-gradient(180deg, rgba(22, 0, 0, 0.95), rgba(8, 0, 0, 0.99));
        box-shadow:
          inset 0 0 18px rgba(255, 30, 30, 0.03),
          0 0 calc(4px + var(--frame-bright) * 10px)
            rgba(255, 55, 55, calc(0.03 + var(--frame-bright) * 0.14));
      }

      .content-box::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 6px;
        border-radius: 34px;
        background: repeating-linear-gradient(
          135deg,
          rgba(255, 185, 185, calc(0.16 + var(--frame-bright) * 0.55)) 0 16px,
          rgba(135, 18, 18, calc(0.24 + var(--frame-bright) * 0.1)) 16px 32px
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: 8;
        filter: drop-shadow(
            0 0 calc(2px + var(--frame-bright) * 4px)
              rgba(255, 120, 120, calc(0.05 + var(--frame-bright) * 0.22))
          )
          drop-shadow(
            0 0 calc(5px + var(--frame-bright) * 8px)
              rgba(255, 55, 55, calc(0.03 + var(--frame-bright) * 0.16))
          );
      }

      .links {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 54px;
        row-gap: 34px;
        padding: 54px 44px;
      }

      .links div {
        color: #f4f1f1;
        font-size: 36px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.4px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      }

      .x-overlay {
        position: absolute;
        inset: -10px;
        z-index: 10;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }

      .x-stage {
        width: 95%;
        max-width: 720px;
        aspect-ratio: 1 / 1;
        position: relative;
        transform-origin: center;
        animation: xScale 2.6s cubic-bezier(0.22, 0.68, 0.22, 1) infinite;
        will-change: transform;
      }

      .x-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      /* bóng rất nhẹ */
      .x-shadow {
        opacity: 0.04;
        filter: blur(4px);
        transform: translate(3px, 4px);
        mix-blend-mode: multiply;
      }

      .x-shadow .outer {
        fill: rgba(0, 0, 0, 0.08);
      }
      .x-shadow .inner {
        fill: rgba(0, 0, 0, 0.04);
      }

      /* X gốc giữ đẹp */
      .x-base .outer {
        fill: rgba(150, 18, 8, 0.42);
      }

      .x-base .inner {
        fill: rgba(95, 8, 6, 0.12);
      }

      /* glow chỉ ở viền */
      .x-ring-glow {
        animation: ringFade 2.6s cubic-bezier(0.22, 0.68, 0.22, 1) infinite;
        filter: drop-shadow(0 0 0 rgba(255, 90, 90, 0))
          drop-shadow(0 0 0 rgba(255, 50, 50, 0));
      }

      .x-ring-glow .outer {
        fill: rgba(255, 68, 30, 0.88);
        animation: ringColor 2.6s cubic-bezier(0.22, 0.68, 0.22, 1) infinite;
      }

      @keyframes xScale {
        0% {
          transform: scale(0.965);
        }
        16% {
          transform: scale(0.965);
        }
        40% {
          transform: scale(1);
        }
        62% {
          transform: scale(1.035);
        }
        78% {
          transform: scale(1.055);
        }
        88% {
          transform: scale(1.065);
        }
        100% {
          transform: scale(1.065);
        }
      }

      @keyframes ringFade {
        0% {
          opacity: 0.1;
          filter: drop-shadow(0 0 0 rgba(255, 90, 90, 0))
            drop-shadow(0 0 0 rgba(255, 50, 50, 0));
        }
        26% {
          opacity: 0.12;
        }
        48% {
          opacity: 0.22;
        }
        68% {
          opacity: 0.38;
          filter: drop-shadow(0 0 1px rgba(255, 100, 100, 0.05))
            drop-shadow(0 0 4px rgba(255, 50, 50, 0.04));
        }
        82% {
          opacity: 0.56;
          filter: drop-shadow(0 0 2px rgba(255, 110, 110, 0.09))
            drop-shadow(0 0 6px rgba(255, 55, 55, 0.06));
        }
        92% {
          opacity: 0.7;
          filter: drop-shadow(0 0 3px rgba(255, 120, 120, 0.12))
            drop-shadow(0 0 8px rgba(255, 60, 60, 0.08));
        }
        100% {
          opacity: 0;
          filter: drop-shadow(0 0 3px rgba(255, 120, 120, 0.12))
            drop-shadow(0 0 8px rgba(255, 60, 60, 0.08));
        }
      }

      @keyframes ringColor {
        0% {
          fill: rgba(170, 24, 12, 0.18);
        }
        26% {
          fill: rgba(170, 24, 12, 0.2);
        }
        48% {
          fill: rgba(195, 28, 14, 0.3);
        }
        68% {
          fill: rgba(220, 36, 16, 0.48);
        }
        82% {
          fill: rgba(255, 58, 24, 0.72);
        }
        92% {
          fill: rgba(255, 58, 24, 0.88);
        }
        100% {
          fill: rgba(255, 58, 24, 0.88);
        }
      }

      @media (max-width: 860px) {
        .card {
          padding: 16px;
          border-radius: 22px;
        }

        .content-box {
          min-height: 420px;
          border-radius: 24px;
        }

        .content-box::before {
          border-radius: 24px;
          padding: 5px;
        }

        .links {
          padding: 34px 24px;
          row-gap: 26px;
          column-gap: 24px;
        }

        .links div {
          font-size: 24px;
        }

        .x-stage {
          width: 97%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="content-shell">
        <div class="x-overlay">
          <div class="x-stage" id="xStage">
            <!-- shadow -->
            <svg
              class="x-svg x-shadow"
              viewBox="0 0 1000 1000"
              aria-hidden="true"
            >
              <polygon
                class="outer"
                points="160,220 220,160 500,440 780,160 840,220 560,500 840,780 780,840 500,560 220,840 160,780 440,500"
              />
              <polygon
                class="inner"
                points="186,220 220,186 500,466 780,186 814,220 534,500 814,780 780,814 500,534 220,814 186,780 466,500"
              />
            </svg>

            <!-- base -->
            <svg
              class="x-svg x-base"
              viewBox="0 0 1000 1000"
              aria-hidden="true"
            >
              <defs>
                <mask id="ringOnlyMask">
                  <polygon
                    fill="white"
                    points="160,220 220,160 500,440 780,160 840,220 560,500 840,780 780,840 500,560 220,840 160,780 440,500"
                  />
                  <polygon
                    fill="black"
                    points="186,220 220,186 500,466 780,186 814,220 534,500 814,780 780,814 500,534 220,814 186,780 466,500"
                  />
                </mask>
              </defs>

              <polygon
                class="outer"
                points="160,220 220,160 500,440 780,160 840,220 560,500 840,780 780,840 500,560 220,840 160,780 440,500"
              />
              <polygon
                class="inner"
                points="186,220 220,186 500,466 780,186 814,220 534,500 814,780 780,814 500,534 220,814 186,780 466,500"
              />
            </svg>

            <!-- glow ring only -->
            <svg
              class="x-svg x-ring-glow"
              id="xGlow"
              viewBox="0 0 1000 1000"
              aria-hidden="true"
            >
              <polygon
                class="outer"
                mask="url(#ringOnlyMask)"
                points="160,220 220,160 500,440 780,160 840,220 560,500 840,780 780,840 500,560 220,840 160,780 440,500"
              />
            </svg>
          </div>
        </div>

        <div class="content-box" id="contentBox">
          <div class="links">
            <div>hitclub2.app</div>
            <div>hitclub2.app</div>
            <div>hitlub.com</div>
            <div>hitlub.com</div>
            <div>hitcub.vin</div>
            <div>hitcub.vin</div>
            <div>hitz.club</div>
            <div>hitz.club</div>
            <div>hitclubvn.pro</div>
            <div>hitclubvn.pro</div>
            <div>hitclub.tw</div>
            <div>hitclub.tw</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const stage = document.getElementById("xStage");
      const glow = document.getElementById("xGlow");
      const box = document.getElementById("contentBox");

      function syncFrameGlow() {
        const stageStyle = getComputedStyle(stage);
        const glowStyle = getComputedStyle(glow);

        const t = stageStyle.transform;
        const glowOpacity = parseFloat(glowStyle.opacity || "0");

        if (!t || t === "none") {
          requestAnimationFrame(syncFrameGlow);
          return;
        }

        const m = t.match(/matrix\(([^)]+)\)/);
        if (!m) {
          requestAnimationFrame(syncFrameGlow);
          return;
        }

        const values = m[1].split(",").map((v) => parseFloat(v.trim()));
        const scale = values[0] || 1;

        const scaleFactor = Math.max(0, Math.min(1, (scale - 0.965) / 0.1));
        const normalized = Math.max(
          0,
          Math.min(1, glowOpacity * 0.8 + scaleFactor * 0.2),
        );

        box.style.setProperty("--frame-bright", normalized.toFixed(3));
        requestAnimationFrame(syncFrameGlow);
      }

      requestAnimationFrame(syncFrameGlow);
    </script>
  </body>
</html>
