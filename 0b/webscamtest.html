<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Morph Animation</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #120000;
      }

      .x-box {
        position: relative;
        width: 360px;
        height: 360px;
      }

      .x-layer {
        position: absolute;
        inset: 0;
        transform-origin: center;
        pointer-events: none;
      }

      .x-core {
        animation: xCoreBurst 1.15s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.35))
          drop-shadow(0 0 18px rgba(255, 0, 0, 0.28));
      }

      .x-echo {
        animation: xEchoBurst 1.15s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.45))
          drop-shadow(0 0 28px rgba(255, 0, 0, 0.35));
      }

      .x-glint {
        animation: xGlint 1.15s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        mix-blend-mode: screen;
      }

      @keyframes xCoreBurst {
        0% {
          transform: scale(0.55);
          opacity: 0.12;
        }
        18% {
          transform: scale(0.78);
          opacity: 0.45;
        }
        38% {
          transform: scale(1.02);
          opacity: 0.95;
        }
        52% {
          transform: scale(1.18);
          opacity: 1;
        }
        68% {
          transform: scale(1.05);
          opacity: 0.72;
        }
        100% {
          transform: scale(0.62);
          opacity: 0.1;
        }
      }

      @keyframes xEchoBurst {
        0% {
          transform: scale(0.62);
          opacity: 0;
        }
        22% {
          transform: scale(0.95);
          opacity: 0.08;
        }
        42% {
          transform: scale(1.18);
          opacity: 0.42;
        }
        56% {
          transform: scale(1.42);
          opacity: 0.95;
        }
        72% {
          transform: scale(1.55);
          opacity: 0.18;
        }
        100% {
          transform: scale(1.62);
          opacity: 0;
        }
      }

      @keyframes xGlint {
        0% {
          transform: scale(0.52);
          opacity: 0;
        }
        28% {
          transform: scale(0.82);
          opacity: 0.18;
        }
        46% {
          transform: scale(1);
          opacity: 0.65;
        }
        56% {
          transform: scale(1.08);
          opacity: 0.9;
        }
        70% {
          transform: scale(1.03);
          opacity: 0.15;
        }
        100% {
          transform: scale(0.62);
          opacity: 0;
        }
      }

      svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div class="x-box">
      <!-- Lớp viền nở ra -->
      <svg class="x-layer x-echo" viewBox="0 0 100 100" aria-hidden="true">
        <line
          x1="18"
          y1="18"
          x2="82"
          y2="82"
          stroke="rgba(255,30,30,0.95)"
          stroke-width="8"
          stroke-linecap="round"
        />
        <line
          x1="82"
          y1="18"
          x2="18"
          y2="82"
          stroke="rgba(255,30,30,0.95)"
          stroke-width="8"
          stroke-linecap="round"
        />
      </svg>

      <!-- Lõi X -->
      <svg class="x-layer x-core" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="xRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7d0000" />
            <stop offset="25%" stop-color="#ff1c1c" />
            <stop offset="50%" stop-color="#ff5a5a" />
            <stop offset="75%" stop-color="#ff1c1c" />
            <stop offset="100%" stop-color="#7d0000" />
          </linearGradient>
        </defs>

        <line
          x1="18"
          y1="18"
          x2="82"
          y2="82"
          stroke="url(#xRed)"
          stroke-width="12"
          stroke-linecap="round"
        />
        <line
          x1="82"
          y1="18"
          x2="18"
          y2="82"
          stroke="url(#xRed)"
          stroke-width="12"
          stroke-linecap="round"
        />
      </svg>

      <!-- highlight trắng nhẹ ở giữa nét -->
      <svg class="x-layer x-glint" viewBox="0 0 100 100" aria-hidden="true">
        <line
          x1="24"
          y1="24"
          x2="76"
          y2="76"
          stroke="rgba(255,255,255,0.28)"
          stroke-width="3"
          stroke-linecap="round"
        />
        <line
          x1="76"
          y1="24"
          x2="24"
          y2="76"
          stroke="rgba(255,255,255,0.28)"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </body>
</html>
