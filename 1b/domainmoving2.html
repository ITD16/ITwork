<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sun</title>
  <link rel="stylesheet" href="../css/style-domain2.css">
</head>
<body>
  <!-- Canvas full màn hình (giữ nguyên khung hiện tại của bạn) -->
  <canvas id="canvas"></canvas>

  <!-- Frame 16:9 chuẩn 1920x1080 (được scale để fit màn hình) -->
  <div id="frame169">
    <!-- Vùng chữ chạy 9:16 ở giữa: 607.5 x 1080 -->
    <div id="portraitStage">
      <h1 class="moving-domain" id="domain1">
        <span class="icon">✅</span>
        <span class="domain-text"></span>
      </h1>

      <h1 class="moving-domain" id="domain2">
        <span class="icon">✅</span>
        <span class="domain-text"></span>
      </h1>
    </div>
  </div>

  <script>
    const CONFIG_URL = "../config.json";

    let domain1 = null;
    let domain2 = null;
    let stage = null;
    let frame = null;

    // ====== Đọc config.json và gán title / domain / firework ======
    let lastDomainsKey = "";

async function applyConfig() {
  try {
    const res = await fetch(CONFIG_URL + "?t=" + Date.now(), { cache: "no-cache" });
    if (!res.ok) throw new Error("Không load được config.json");
    const cfg = await res.json();

    if (cfg.title) document.title = cfg.title;

    const domains = cfg.domains1b || [];
    const d1 = domains[0] || "";
    const d2 = domains[1] || "";

    // Nếu không đổi gì thì thôi (đỡ “nhấp nháy/refresh cảm giác”)
    const key = d1 + "||" + d2 + "||" + String(cfg.enableFirework === true);
    if (key === lastDomainsKey) return;
    lastDomainsKey = key;

    const d1Text = domain1.querySelector(".domain-text");
    const d2Text = domain2.querySelector(".domain-text");
    if (d1Text) d1Text.textContent = d1;
    if (d2Text) d2Text.textContent = d2;

    window.ENABLE_FIREWORK = cfg.enableFirework === true;

    // Không random lại vị trí nữa.
    // Nếu text dài/ngắn làm “đụng biên”, ta chỉ clamp lại nhẹ nhàng:
    requestAnimationFrame(clampPositions);

  } catch (e) {
    console.error(e);
    window.ENABLE_FIREWORK = false;
  }
}

    // ====== Scale frame 1920x1080 để fit màn hình ======
    function fitFrame169() {
      if (!frame) return;
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    // ====== Moving / Bouncing 2 dòng domain trong portraitStage ======
    let x1 = 0, y1 = 0, dx1 = 1.3, dy1 = 1.6;
    let x2 = 0, y2 = 0, dx2 = 1.3, dy2 = 1.6;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function initPositions() {
      if (!domain1 || !domain2 || !stage) return;

      // stage cố định: 607.5 x 1080 (nhưng vẫn đọc clientWidth/Height cho chắc)
      const W = stage.clientWidth;
      const H = stage.clientHeight;

      const w1 = domain1.offsetWidth;
      const h1 = domain1.offsetHeight;
      const w2 = domain2.offsetWidth;
      const h2 = domain2.offsetHeight;

      // nếu chữ quá dài vượt stage => vẫn cho chạy, nhưng ép biên để tránh NaN/âm
      x1 = random(0, Math.max(1, W - w1));
      y1 = random(0, Math.max(1, H - h1));
      x2 = random(0, Math.max(1, W - w2));
      y2 = random(0, Math.max(1, H - h2));

      dx1 = 1.3 * (Math.random() < 0.5 ? 1 : -1);
      dy1 = 1.6 * (Math.random() < 0.5 ? 1 : -1);

      dx2 = 1.3 * (Math.random() < 0.5 ? 1 : -1);
      dy2 = 1.6 * (Math.random() < 0.5 ? 1 : -1);
    }
    function clampPositions() {
  if (!domain1 || !domain2 || !stage) return;

  const W = stage.clientWidth;
  const H = stage.clientHeight;

  const w1 = domain1.offsetWidth;
  const h1 = domain1.offsetHeight;
  const w2 = domain2.offsetWidth;
  const h2 = domain2.offsetHeight;

  // giữ nguyên x/y hiện tại, chỉ ép vào trong biên
  x1 = Math.min(Math.max(0, x1), Math.max(0, W - w1));
  y1 = Math.min(Math.max(0, y1), Math.max(0, H - h1));
  x2 = Math.min(Math.max(0, x2), Math.max(0, W - w2));
  y2 = Math.min(Math.max(0, y2), Math.max(0, H - h2));
}

    function animate1() {
      if (!domain1 || !stage) return;

      const W = stage.clientWidth;
      const H = stage.clientHeight;
      const w = domain1.offsetWidth;
      const h = domain1.offsetHeight;

      x1 += dx1;
      y1 += dy1;

      if (x1 <= 0 || x1 + w >= W) dx1 = -dx1;
      if (y1 <= 0 || y1 + h >= H) dy1 = -dy1;

      domain1.style.left = x1 + "px";
      domain1.style.top  = y1 + "px";

      requestAnimationFrame(animate1);
    }

    function animate2() {
      if (!domain2 || !stage) return;

      const W = stage.clientWidth;
      const H = stage.clientHeight;
      const w = domain2.offsetWidth;
      const h = domain2.offsetHeight;

      x2 += dx2;
      y2 += dy2;

      if (x2 <= 0 || x2 + w >= W) dx2 = -dx2;
      if (y2 <= 0 || y2 + h >= H) dy2 = -dy2;

      domain2.style.left = x2 + "px";
      domain2.style.top  = y2 + "px";

      requestAnimationFrame(animate2);
    }

    // ====== Start ======
    async function startAll() {
      domain1 = document.getElementById("domain1");
      domain2 = document.getElementById("domain2");
      stage   = document.getElementById("portraitStage");
      frame   = document.getElementById("frame169");

      if (!domain1 || !domain2 || !stage || !frame) {
        console.error("Thiếu #domain1 / #domain2 / #portraitStage / #frame169");
        return;
      }

      fitFrame169();

      // Load config lần đầu
      await applyConfig();

      // Đợi 1 frame để layout ổn rồi mới đo size + chạy
      requestAnimationFrame(() => {
        initPositions();
        animate1();
        animate2();
      });

      // Auto reload config mỗi 10s
      setInterval(applyConfig, 10000);

      // Resize: scale frame + re-init để chữ không kẹt biên
      window.addEventListener("resize", () => {
        fitFrame169();
        initPositions();
      });
    }

    window.addEventListener("load", startAll);
  </script>
</body>
</html>
