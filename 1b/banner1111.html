<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
    margin:0;
    padding:0;
    background:black;
    height:100%;
    overflow:hidden;
}

/* khung 9:16 portrait */
#stage{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:black;
}

/* khi fullscreen */
#stage:fullscreen,
#stage:-webkit-full-screen {
    width:100vw;
    height:100vh;
}

/* nội dung portrait */
#stage img{
    height:100vh;
    width:auto;
    max-width:100vw;
    object-fit:contain;
}
    </style>
</head>
<body>
  <div id="stage">
      <img src="../img/bannertablet1111.png">
  </div>



    <!-- Chạy script Double Fullscreen -->
  <script>
      // Hàm bật fullscreen
function requestFullscreen() {
  const el = document.getElementById("stage");

  if (el.requestFullscreen) {
    el.requestFullscreen().then(lockPortrait);
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
    lockPortrait();
  }
}

      async function lockPortrait(){
  try{
    await screen.orientation.lock("portrait");
  }catch(e){
    console.log("Orientation lock not supported");
  }
}

// Double TAP (mobile) và double CLICK (desktop)
let lastTapTime = 0;

function handleDoubleTap() {
  const now = Date.now();
  const tapInterval = now - lastTapTime;

  if (tapInterval < 300 && tapInterval > 0) {
    requestFullscreen();
  }

  lastTapTime = now;
}

// Cho mobile
document.addEventListener('touchstart', handleDoubleTap);

// Cho desktop
document.addEventListener('dblclick', requestFullscreen);
  </script>
  

</body>
</html>
