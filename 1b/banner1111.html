<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tablet Portrait Lock</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
    }

    /* Lớp phủ full màn hình */
    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    /* Khung nội dung luôn theo kiểu dọc */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 100dvh;
      transform: translate(-50%, -50%);
      transform-origin: center center;

      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Ảnh luôn fit theo khung dọc */
    #stage img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Khi browser bị ép ngang, xoay ngược stage để nhìn vẫn dọc */
    .force-portrait-landscape #stage {
      width: 100dvh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <img src="../img/bannertablet1111.png" alt="Banner" />
    </div>
  </div>

  <script>
    function applyPortraitMode() {
      const app = document.getElementById("app");
      const isLandscape = window.innerWidth > window.innerHeight;

      if (isLandscape) {
        app.classList.add("force-portrait-landscape");
      } else {
        app.classList.remove("force-portrait-landscape");
      }
    }

    async function tryLockPortrait() {
      if (!screen.orientation || !screen.orientation.lock) return;

      try {
        await screen.orientation.lock("portrait-primary");
      } catch (e) {
        // Via có thể bỏ qua, không sao
      }
    }

    function init() {
      applyPortraitMode();
      tryLockPortrait();
    }

    window.addEventListener("load", init);
    window.addEventListener("resize", applyPortraitMode);
    window.addEventListener("orientationchange", applyPortraitMode);

    // Chạm lần đầu sẽ thử lock lại (vì nhiều browser chỉ cho phép sau user gesture)
    document.addEventListener("touchstart", tryLockPortrait, { passive: true });
    document.addEventListener("click", tryLockPortrait);
  </script>
</body>
</html>
