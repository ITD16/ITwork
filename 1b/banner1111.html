<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <title>Portrait Fullscreen</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
    }

    /* Phần tử sẽ được fullscreen */
    #fsRoot {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    /* Khung hiển thị nội dung */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 100dvh;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    #stage img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* đổi thành cover nếu muốn phủ kín */
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Nếu thiết bị đang ngang nhưng ta muốn nhìn như dọc */
    .force-portrait #stage {
      width: 100dvh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  </style>
</head>
<body>
  <div id="fsRoot">
    <div id="stage">
      <img src="../img/bannertablet1111.png" alt="Banner" />
    </div>
  </div>

  <script>
    const fsRoot = document.getElementById("fsRoot");

    async function tryLockPortrait() {
      if (!screen.orientation || !screen.orientation.lock) return false;

      try {
        // thử kiểu bao quát trước
        await screen.orientation.lock("portrait");
        return true;
      } catch (e1) {
        try {
          // fallback
          await screen.orientation.lock("portrait-primary");
          return true;
        } catch (e2) {
          return false;
        }
      }
    }

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    async function enterFullscreen() {
      // Thử khóa trước
      await tryLockPortrait();

      try {
        if (fsRoot.requestFullscreen) {
          await fsRoot.requestFullscreen({ navigationUI: "hide" });
        } else if (fsRoot.webkitRequestFullscreen) {
          fsRoot.webkitRequestFullscreen();
        } else if (fsRoot.msRequestFullscreen) {
          fsRoot.msRequestFullscreen();
        }
      } catch (e) {
        // bỏ qua, browser có thể chặn
      }

      // Thử khóa lại sau khi đã fullscreen
      await tryLockPortrait();

      // Áp fallback xoay nội dung nếu vẫn bị ngang
      applyVisualPortraitFallback();
    }

    function applyVisualPortraitFallback() {
      const isLandscape = window.innerWidth > window.innerHeight;

      // Nếu đang fullscreen mà viewport vẫn ngang -> xoay ngược nội dung
      if (isLandscape) {
        fsRoot.classList.add("force-portrait");
      } else {
        fsRoot.classList.remove("force-portrait");
      }
    }

    function handleDoubleTap() {
      const now = Date.now();
      const delta = now - (handleDoubleTap.lastTap || 0);

      if (delta > 0 && delta < 300) {
        enterFullscreen();
      }

      handleDoubleTap.lastTap = now;
    }
    handleDoubleTap.lastTap = 0;

    // Retry sau khi browser đổi trạng thái fullscreen
    document.addEventListener("fullscreenchange", async () => {
      if (isFullscreen()) {
        await tryLockPortrait();
      }
      applyVisualPortraitFallback();
    });

    document.addEventListener("webkitfullscreenchange", async () => {
      if (isFullscreen()) {
        await tryLockPortrait();
      }
      applyVisualPortraitFallback();
    });

    window.addEventListener("resize", applyVisualPortraitFallback);
    window.addEventListener("orientationchange", () => {
      setTimeout(applyVisualPortraitFallback, 50);
    });

    document.addEventListener("touchstart", handleDoubleTap, { passive: true });
    document.addEventListener("dblclick", enterFullscreen);
  </script>
</body>
</html>
