<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    *{
        margin: 0;
        padding: 0;
        user-select: none;
        list-style-type: none;
        box-sizing: border-box;
    }

    body{
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(29, 83, 83);
    }

    .card{
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 40px;
        font-weight: 700;
    }

    .yellow {
        color: rgb(231, 216, 83);
    }

    .normal {
        color: white; 
    }

    .list{
        width: 280px;              /* tăng thêm 100px */
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        text-align: center;
    }

    .list li{
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.1;
        font-size: 25px;           /* font mặc định */
        font-family: sans-serif;
    }
</style>
</head>
<body>
    <div id="card" class="card">
        <ul class="list" id="list1"></ul>
        <ul class="list" id="list2"></ul>
    </div>

<script>
    const CONFIG_URL = "../config.json";
    const POLL_INTERVAL = 10000;
    const HIDDEN_INTERVAL = 30000;

    const list1 = document.getElementById("list1");
    const list2 = document.getElementById("list2");

    let lastSignature = "";
    let pollTimer = null;
    let isFetching = false;

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatText(text) {
        let result = "";
        let i = 0;

        while (i < text.length) {
            const part = text.slice(i, i + 3).toLowerCase();

            if (part === "sun" || part === "win") {
                result += `<span class="normal">${escapeHtml(text.slice(i, i + 3))}</span>`;
                i += 3;
            } else {
                result += `<span class="yellow">${escapeHtml(text[i])}</span>`;
                i++;
            }
        }

        return result;
    }

    function normalizeList(data) {
        if (!Array.isArray(data)) return [];
        return data.map(item => String(item).toLowerCase());
    }

    function createSignature(list) {
        return JSON.stringify(list);
    }

    function renderLists(list) {
        const frag1 = document.createDocumentFragment();
        const frag2 = document.createDocumentFragment();

        for (const value of list) {
            const fontSize = getFontSize(value);

            const liEl1 = document.createElement("li");
            liEl1.innerHTML = formatText(value);
            liEl1.style.fontSize = fontSize + "px";

            const liEl2 = document.createElement("li");
            liEl2.innerHTML = formatText(value);
            liEl2.style.fontSize = fontSize + "px";

            frag1.appendChild(liEl1);
            frag2.appendChild(liEl2);
        }

        list1.replaceChildren(frag1);
        list2.replaceChildren(frag2);
    }
    async function fetchAndUpdate() {
        if (isFetching) return;
        isFetching = true;

        try {
            const res = await fetch(CONFIG_URL, {
                cache: "no-cache"
            });

            if (!res.ok) throw new Error("Không load được config.json");

            const cfg = await res.json();
            const listweb = normalizeList(cfg.webscam1b);
            const newSignature = createSignature(listweb);

            if (newSignature !== lastSignature) {
                lastSignature = newSignature;
                renderLists(listweb);
            }
        } catch (e) {
            console.error("Lỗi cập nhật config:", e);
        } finally {
            isFetching = false;
            scheduleNextPoll();
        }
    }

    function scheduleNextPoll() {
        clearTimeout(pollTimer);

        const interval = document.hidden ? HIDDEN_INTERVAL : POLL_INTERVAL;
        pollTimer = setTimeout(fetchAndUpdate, interval);
    }

    document.addEventListener("visibilitychange", () => {
        clearTimeout(pollTimer);
        scheduleNextPoll();
    });
    function getFontSize(text) {
    const len = String(text).length;

    if (len <= 16) return 27;
    if (len <= 18) return 25;
    if (len <= 20) return 23;
    if (len <= 22) return 21;
    return 19;
}

    fetchAndUpdate();
</script>
</body>
</html>
