<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Idol</title>
    <link rel="stylesheet" href="/css/contentidol.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <div id="tickerWrap" class="ticker-wrap hidden">
        <div id="tickerTrack" class="ticker-track">
          <div id="tickerLaneA" class="ticker-lane"></div>
          <div id="tickerLaneB" class="ticker-lane"></div>
        </div>
      </div>
    </div>

    <script>
      const els = {
        stage: document.getElementById("stage"),
        tickerWrap: document.getElementById("tickerWrap"),
        tickerTrack: document.getElementById("tickerTrack"),
        tickerLaneA: document.getElementById("tickerLaneA"),
        tickerLaneB: document.getElementById("tickerLaneB"),
      };

      let configCache = null;
      let watchTimer = null;
      let visibilityTimer = null;
      let hideFadeTimer = null;
      let currentActiveKey = "";
      let currentVisibilityKey = "";

      const FADE_MS = 600; /*Chỉnh thời gian tan dần của content idol chỉnh thêm bên .css ticker.wrap transition */

      async function fetchConfig() {
        const res = await fetch("/config.json?ts=" + Date.now(), {
          cache: "no-store",
        });
        if (!res.ok) throw new Error("Cannot load config.json");
        return res.json();
      }

      function getSettings(cfg) {
        const s = cfg?.contentidolSettings || {};
        return {
          enabled: s.enabled !== false,
          speedPxPerSecond: Number(s.speedPxPerSecond || 140),
          fontSize: Number(s.fontSize || 48),
          textColor: s.textColor || "#ffffff",
          copiesPerRun: Number(s.copiesPerRun || 8),
          copyGapSize: Number(s.copyGapSize || 24),
          laneGapPx: Number(s.laneGapPx || 160),
          showMinutes: Number(s.showMinutes || 0),
          hideMinutes: Number(s.hideMinutes || 0),
        };
      }

      function hhmmToMinutes(value) {
        const [hh, mm] = String(value || "00:00")
          .split(":")
          .map(Number);
        return (hh || 0) * 60 + (mm || 0);
      }

      function getNowMinutesGMT7() {
        const vn = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(new Date());

        return hhmmToMinutes(vn);
      }

      function isInTimeRange(startTime, endTime, nowMinutes) {
        const start = hhmmToMinutes(startTime);
        const end = hhmmToMinutes(endTime);

        if (start < end) {
          return nowMinutes >= start && nowMinutes < end;
        }

        if (start > end) {
          return nowMinutes >= start || nowMinutes < end;
        }

        return nowMinutes === start;
      }

      function buildRepeatedText(text, count = 8, gapSize = 24) {
        const gap = "\u00A0".repeat(gapSize);
        return Array.from({ length: count }, () => text).join(gap);
      }

      function applyStyle(settings) {
        els.tickerWrap.style.fontSize = `${settings.fontSize}px`;
        els.tickerWrap.style.color = settings.textColor || "#ffffff";
      }

      function getActiveContentItem(list) {
        const nowMinutes = getNowMinutesGMT7();

        const enabledItems = list.filter(
          (item) => item && item.enabled !== false && item.text,
        );

        const activeItems = enabledItems.filter((item) =>
          isInTimeRange(item.startTime, item.endTime, nowMinutes),
        );

        if (activeItems.length) return activeItems[0];

        return enabledItems.length
          ? enabledItems[enabledItems.length - 1]
          : null;
      }

      function getActiveKey(item) {
        if (!item) return "";
        return `${item.text}__${item.startTime}__${item.endTime}__${item.enabled}`;
      }

      function shouldShowByCycle(settings) {
        const showMinutes = Number(settings.showMinutes || 0);
        const hideMinutes = Number(settings.hideMinutes || 0);

        if (showMinutes <= 0 && hideMinutes <= 0) return true;
        if (showMinutes > 0 && hideMinutes <= 0) return true;
        if (showMinutes <= 0 && hideMinutes > 0) return false;

        const cycleMs = (showMinutes + hideMinutes) * 60 * 1000;
        if (cycleMs <= 0) return true;

        const elapsed = Date.now() % cycleMs;
        return elapsed < showMinutes * 60 * 1000;
      }

      function getVisibilityKey(settings) {
        const showMinutes = Number(settings.showMinutes || 0);
        const hideMinutes = Number(settings.hideMinutes || 0);

        if (showMinutes <= 0 && hideMinutes <= 0) return "always-show";
        if (showMinutes > 0 && hideMinutes <= 0) return "always-show";
        if (showMinutes <= 0 && hideMinutes > 0) return "always-hide";

        const cycleMs = (showMinutes + hideMinutes) * 60 * 1000;
        const elapsed = Date.now() % cycleMs;
        const state = elapsed < showMinutes * 60 * 1000 ? "show" : "hide";
        return `${showMinutes}_${hideMinutes}_${state}`;
      }

      function showTickerWrap() {
        if (hideFadeTimer) {
          clearTimeout(hideFadeTimer);
          hideFadeTimer = null;
        }
        els.tickerWrap.classList.remove("hidden");
      }

      function hideTickerWithFade() {
        if (hideFadeTimer) {
          clearTimeout(hideFadeTimer);
          hideFadeTimer = null;
        }

        els.tickerWrap.classList.add("hidden");

        hideFadeTimer = setTimeout(() => {
          if (els.tickerWrap.classList.contains("hidden")) {
            els.tickerTrack.style.animation = "none";
          }
        }, FADE_MS);
      }

      function hideTickerCompletely() {
        hideTickerWithFade();
      }

      function renderTicker(cfg) {
        const settings = getSettings(cfg);
        const list = Array.isArray(cfg.contentidol)
          ? cfg.contentidol.filter((item) => item && item.text)
          : [];

        currentVisibilityKey = getVisibilityKey(settings);

        if (!settings.enabled || !list.length) {
          hideTickerCompletely();
          currentActiveKey = "";
          return;
        }

        if (!shouldShowByCycle(settings)) {
          hideTickerCompletely();
          return;
        }

        const activeItem = getActiveContentItem(list);

        if (!activeItem || !activeItem.text) {
          hideTickerCompletely();
          currentActiveKey = "";
          return;
        }

        currentActiveKey = getActiveKey(activeItem);

        const repeated = buildRepeatedText(
          activeItem.text,
          settings.copiesPerRun || 8,
          settings.copyGapSize || 24,
        );

        applyStyle(settings);

        els.tickerLaneA.style.paddingRight = `${settings.laneGapPx || 160}px`;
        els.tickerLaneB.style.paddingRight = `${settings.laneGapPx || 160}px`;

        els.tickerLaneA.textContent = repeated;
        els.tickerLaneB.textContent = repeated;

        showTickerWrap();

        requestAnimationFrame(() => {
          const laneWidth = els.tickerLaneA.scrollWidth;
          const speed = Math.max(40, settings.speedPxPerSecond || 140);
          const duration = laneWidth / speed;

          els.tickerTrack.style.setProperty("--lane-width", `${laneWidth}px`);
          els.tickerTrack.style.animation = "none";

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              els.tickerTrack.style.animation = `tickerLoop ${duration}s linear infinite`;
            });
          });
        });
      }

      function checkActiveSlotOnly() {
        if (!configCache) return;

        const settings = getSettings(configCache);
        const nextVisibilityKey = getVisibilityKey(settings);

        if (nextVisibilityKey !== currentVisibilityKey) {
          renderTicker(configCache);
          return;
        }

        if (!shouldShowByCycle(settings)) return;

        const list = Array.isArray(configCache.contentidol)
          ? configCache.contentidol.filter((item) => item && item.text)
          : [];

        const activeItem = getActiveContentItem(list);
        const nextKey = getActiveKey(activeItem);

        if (nextKey !== currentActiveKey) {
          renderTicker(configCache);
        }
      }

      async function initTicker() {
        try {
          const cfg = await fetchConfig();
          configCache = cfg;
          renderTicker(cfg);
        } catch (err) {
          console.error(err);
        }
      }

      async function watchConfigChanges() {
        if (watchTimer) clearInterval(watchTimer);

        watchTimer = setInterval(async () => {
          try {
            const latest = await fetchConfig();
            const before = JSON.stringify(configCache || {});
            const after = JSON.stringify(latest || {});

            if (before !== after) {
              configCache = latest;
              renderTicker(latest);
            }
          } catch (err) {
            console.error("watchConfigChanges:", err);
          }
        }, 30000);
      }

      function startVisibilityWatcher() {
        if (visibilityTimer) clearInterval(visibilityTimer);

        visibilityTimer = setInterval(() => {
          checkActiveSlotOnly();
        }, 5000);
      }

      window.addEventListener("resize", () => {
        if (configCache) {
          renderTicker(configCache);
        }
      });

      initTicker();
      watchConfigChanges();
      startVisibilityWatcher();
    </script>
  </body>
</html>
