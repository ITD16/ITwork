<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../logo/config.png?v=1" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        user-select: none;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ededed;
      }

      .card {
        width: 70%;
        position: relative;
        box-shadow: 5px 6px 20px -1px #000000;
      }

      .cave {
        width: 100%;
        display: block;
      }

      .caveman {
        width: 58%;
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
      }
      .txt {
        position: absolute;
        left: 50%;
        top: 43%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: bold;
        font-size: 4rem;
        white-space: nowrap;
        animation: anime duration timing-function delay iteration-count
          direction fill-mode;
      }

      .alert {
        position: absolute;
        left: 10px;
        top: 0;
        width: 300px;
        height: 30px;
        background-color: #be3737;
        color: #ededed;
        border-radius: 10px;
        text-align: center;
        transform: translateY(-50px);
      }

      .note {
        line-height: 30px;
      }

      .animated {
        animation-name: moving;
        animation-duration: 2s;
        animation-iteration-count: infinite;
      }

      @keyframes moving {
        0% {
          transform: translate(-50%, -43%);
        }

        50% {
          transform: translate(-50%, -60%);
        }

        80% {
          transform: translate(-50%, -60%);
        }
        100% {
          transform: translate(-50%, -43%);
        }
      }

      .animated2 {
        animation-name: moving2;
        animation-duration: 5s;
      }

      @keyframes moving2 {
        10% {
          transform: translateY(-50px);
        }
        20% {
          transform: translateY(10px);
        }
        90% {
          transform: translateY(10px);
        }
        100% {
          transform: translateY(-50px);
        }
      }

      /* RESPONSIVE */
      @media (max-width: 1024px) {
        .card {
          width: 85%;
        }

        .caveman {
          width: 62%;
        }

        .txt {
          top: 40%;
        }
      }

      @media (max-width: 768px) {
        .card {
          width: 95%;
        }
        .caveman {
          width: 68%;
        }
        .txt {
          top: 36%;
          font-size: clamp(0.9rem, 5vw, 2.2rem);
          width: 92%;
        }
      }

      @media (max-width: 480px) {
        .caveman {
          width: 75%;
        }
        .txt {
          top: 32%;
          font-size: clamp(0.8rem, 5.5vw, 1.4rem);
          width: 94%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="cave" src="./img/cave1.jpg" alt="" />
      <p class="txt animated">ASK LAM ANYTHING!</p>
      <img class="caveman" src="./img/caveman.png" alt="" />
    </div>
    <div class="alert animated2">
      <p class="note">Your behavior has been recorded!</p>
    </div>

    <script>
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      document.addEventListener(
        "keydown",
        (e) => {
          const k = e.key.toLowerCase();

          if (
            e.key === "F12" ||
            ((e.ctrlKey || e.metaKey) && k === "u") ||
            ((e.ctrlKey || e.metaKey) && k === "s") ||
            (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) ||
            (e.metaKey && e.altKey && ["i", "j", "c"].includes(k))
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        },
        true,
      );
    </script>
  </body>
</html>
