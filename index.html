<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Login</title>
    <link rel="stylesheet" href="/css/style-admin.css" />
    <link rel="icon" type="image/png" href="../logo/config.png?v=1" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem("site-theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
  </head>

  <body class="login-page">
    <div id="particles-js"></div>

    <div class="login-shell">
      <div class="card login-card">
        <h1>Dashboard Config</h1>
        <p class="muted">Please call Ata to obtain access permissions.</p>

        <form id="loginForm" class="stack">
          <label>
            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="Nhập username..."
              required
            />
          </label>

          <label>
            <div class="password-wrap">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Nhập password..."
                required
              />

              <button
                id="togglePasswordBtn"
                type="button"
                class="password-toggle"
                aria-label="Show password"
                title="Show password"
              >
                <span id="passwordEyeIcon" class="password-eye-icon">
                  <svg
                    id="eyeClosedSvg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="display: block"
                  >
                    <path
                      d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"
                    ></path>
                    <path d="M4 4l16 16"></path>
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                  </svg>

                  <svg
                    id="eyeOpenSvg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="display: none"
                  >
                    <path
                      d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
              </button>
            </div>
          </label>

          <button type="submit">Login</button>
          <div id="loginError" class="error"></div>
        </form>
      </div>
    </div>

    <script src="/js/login.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const passwordInput = document.getElementById("password");
        const togglePasswordBtn = document.getElementById("togglePasswordBtn");
        const eyeClosedSvg = document.getElementById("eyeClosedSvg");
        const eyeOpenSvg = document.getElementById("eyeOpenSvg");

        if (
          !passwordInput ||
          !togglePasswordBtn ||
          !eyeClosedSvg ||
          !eyeOpenSvg
        )
          return;

        togglePasswordBtn.addEventListener("click", function () {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          eyeClosedSvg.style.display = isPassword ? "none" : "block";
          eyeOpenSvg.style.display = isPassword ? "block" : "none";
        });
      });
    </script>
    <script>
      (function () {
        const THEME_KEY = "site-theme";

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          const toggle = document.getElementById("themeToggle");
          if (toggle) {
            toggle.checked = theme === "dark";
          }
        }

        document.addEventListener("DOMContentLoaded", function () {
          const toggle = document.getElementById("themeToggle");
          const savedTheme = localStorage.getItem(THEME_KEY) || "light";

          applyTheme(savedTheme);

          if (toggle) {
            toggle.addEventListener("change", function () {
              const nextTheme = toggle.checked ? "dark" : "light";
              localStorage.setItem(THEME_KEY, nextTheme);
              applyTheme(nextTheme);
            });
          }
        });
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="/js/background.js"></script>
  </body>
</html>
