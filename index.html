<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Login</title>
    <link rel="stylesheet" href="/css/style-admin.css" />
    <link rel="icon" type="image/png" href="../logo/config.png?v=1" />
  </head>
  
  <body class="login-page">
    <div class="card login-card">
      <h1>Dashboard Config</h1>
      <p class="muted">Please call Ata to obtain access permissions.</p></br>

      <form id="loginForm" class="stack">
        <label>
          <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Nhập username..."
            required
          />
        </label>
       <label>
  <label>
  <div class="password-wrap">
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Nhập password..."
      required
    />

    <button
      id="togglePasswordBtn"
      type="button"
      class="password-toggle"
      aria-label="Show password"
      title="Show password"
    >
      <span id="passwordEyeIcon" class="password-eye-icon">
        <svg
          id="eyeClosedSvg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l18 18"></path>
          <path d="M10.7 10.7a2 2 0 0 0 2.6 2.6"></path>
          <path d="M9.2 4.6A10.4 10.4 0 0 1 12 4.2c5 0 8.9 3.1 10 7.8a11 11 0 0 1-2.8 4.2"></path>
          <path d="M6.4 6.4C4.4 7.8 2.9 9.7 2 12c1.7 4.6 5.7 7.8 10 7.8 1.7 0 3.3-.5 4.7-1.2"></path>
        </svg>

        <svg
          id="eyeOpenSvg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="display: none"
        >
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </span>
    </button>
  </div>
</label>
</label>
        <button type="submit">Login</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>

    <script src="/js/login.js"></script>
    <script>
  document.addEventListener("DOMContentLoaded", function () {
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const eyeClosedSvg = document.getElementById("eyeClosedSvg");
    const eyeOpenSvg = document.getElementById("eyeOpenSvg");

    if (!passwordInput || !togglePasswordBtn || !eyeClosedSvg || !eyeOpenSvg) {
      return;
    }

    togglePasswordBtn.addEventListener("click", function () {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      eyeClosedSvg.style.display = isPassword ? "none" : "block";
      eyeOpenSvg.style.display = isPassword ? "block" : "none";

      togglePasswordBtn.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password"
      );
      togglePasswordBtn.setAttribute(
        "title",
        isPassword ? "Hide password" : "Show password"
      );
    });
  });
</script>
  </body>
</html>
